[project]
name = "policyiq"
version = "0.1.0"
description = "Django + HTMX RAG application for policy document Q&A"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.105.2",
    "chromadb==1.5.9",
    "Django==6.0.5",
    "django-cors-headers==4.9.0",
    "djangorestframework==3.17.1",
    "psycopg2-binary==2.9.12",
    "PyMuPDF==1.27.2.3",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "tiktoken==0.13.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "policyiq.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
